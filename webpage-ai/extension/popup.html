<!DOCTYPE html>
<html>

<head>
    <title>Chat With Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Chat With Webpage</h2>

        <button id="extractBtn">
            Load Page
        </button>

        <div id="status">
            Page not loaded
        </div>

        <div id="chatBox"></div>

        <div class="inputArea">

            <input
                type="text"
                id="question"
                placeholder="Ask something about this page..."
            />

            <button id="askBtn">
                Ask
            </button>

        </div>

    </div>

    <script src="popup.js"></script>

</body>

</html>
